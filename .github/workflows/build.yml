name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          # Exact SDK from global.json: its runtime pack ends up in the self-contained build.
          global-json-file: global.json

      - name: Rebuild the Go sidecars from source
        # colitu-engine.exe and csl-client.exe must come out byte for byte from the colitu/csl
        # commit and Go release pinned in scripts/cores.json (GOTOOLCHAIN fetches that exact Go).
        shell: pwsh
        run: ./scripts/build-sidecars.ps1

      - name: Restore
        working-directory: ./src
        run: dotnet restore ./ColituVPN/ColituVPN.csproj && dotnet restore ./ColituKillSwitchService/ColituKillSwitchService.csproj && dotnet restore ./ServiceLib.Tests/ServiceLib.Tests.csproj && dotnet restore ./ColituVPN.Tests/ColituVPN.Tests.csproj

      - name: Build Colitu VPN
        working-directory: ./src
        run: dotnet build ./ColituVPN/ColituVPN.csproj -c Release --no-restore && dotnet build ./ColituKillSwitchService/ColituKillSwitchService.csproj -c Release --no-restore

      - name: Test
        working-directory: ./src
        run: |
          dotnet test ./ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore
          dotnet test ./ColituVPN.Tests/ColituVPN.Tests.csproj -c Release --no-restore

      - name: Publish
        working-directory: ./src
        run: |
          dotnet publish ./ColituVPN/ColituVPN.csproj -c Release -r win-x64 -p:SelfContained=true -o ${{ github.workspace }}/publish
          dotnet publish ./ColituKillSwitchService/ColituKillSwitchService.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ${{ github.workspace }}/publish

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ColituVPN-win-x64
          path: publish
